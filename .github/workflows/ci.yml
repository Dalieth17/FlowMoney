name: CI

on:
  push:
    branches: [DEV, QA, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, formato y tests del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:web

  api:
    name: Tests de la API (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: flowmoney
          MYSQL_USER: flowmoney
          MYSQL_PASSWORD: flowmoney
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: flowmoney
      DB_PASSWORD: flowmoney
      DB_NAME: flowmoney
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:integration

  docker:
    name: Build de imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Build de la imagen unificada para Railway
        run: docker build -t flowmoney-railway .
      - name: Arranque de producción con MySQL y puerto dinámico
        env:
          DB_PASSWORD: ci-only-strong-db-password
          MYSQL_ROOT_PASSWORD: ci-only-strong-root-password
        run: |
          docker compose up -d --wait db
          docker run -d --name railway-smoke --network flowmoney_default -p 127.0.0.1:8087:8080 \
            -e MYSQLHOST=db -e MYSQLPORT=3306 -e MYSQLUSER=flowmoney -e MYSQLDATABASE=flowmoney \
            -e MYSQLPASSWORD="$DB_PASSWORD" -e COOKIE_SECURE=true -e PORT=8080 flowmoney-railway
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8087/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8087/api/health
          docker exec -i railway-smoke node < scripts/railway-smoke.cjs
      - name: Logs del despliegue de prueba si falla
        if: failure()
        run: docker logs railway-smoke || true
      - name: Limpiar servicios de prueba
        if: always()
        run: |
          docker rm -f railway-smoke || true
          docker compose down --volumes

  android:
    name: App Android (build, tests y lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Valida el gradle-wrapper.jar y cachea dependencias.
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests de dominio y app, lint y APK de depuración
        run: ./gradlew :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Publicar APK de depuración
        uses: actions/upload-artifact@v4
        with:
          name: flowmoney-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar reportes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports
            apps/android/domain/build/reports
