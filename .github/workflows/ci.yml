name: CI

on:
  push:
    branches: [DEV, QA, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, formato y tests del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:web

  api:
    name: Tests de la API (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: flowmoney
          MYSQL_USER: flowmoney
          MYSQL_PASSWORD: flowmoney
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: flowmoney
      DB_PASSWORD: flowmoney
      DB_NAME: flowmoney
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:integration

  docker:
    name: Build de imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker compose build

  android:
    name: App Android (build, tests y lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Valida el gradle-wrapper.jar y cachea dependencias.
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests de dominio y app, lint y APK de depuración
        run: ./gradlew :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Publicar APK de depuración
        uses: actions/upload-artifact@v4
        with:
          name: flowmoney-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar reportes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/domain/build/reports
