server {
    listen       8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # DNS interno de Docker resuelto en cada petición: Nginx arranca aunque la
    # API todavía no exista y se recupera si su contenedor se reinicia.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    # API (mismo origen: sin CORS). Helmet ya añade sus cabeceras de seguridad.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # HTML, JS y CSS no llevan hash en el nombre: siempre revalidar (ETag)
    # para no servir versiones viejas después de un despliegue.
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
