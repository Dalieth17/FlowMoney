<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>FlowMoney · Panel</title>
  <meta name="description" content="Panel de FlowMoney: movimientos, cuentas, categorías, presupuestos y reportes.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script type="module" src="assets/js/pages/app.js"></script>
</head>
<body>
  <a class="visually-hidden" href="#view">Saltar al contenido</a>
  <div class="app">
    <aside class="sidebar" aria-label="Navegación principal">
      <a class="brand" href="index.html">
        <img class="mark" src="assets/img/favicon.svg" alt="" width="30" height="30">
        FlowMoney
      </a>
      <nav class="side-nav">
        <a href="#/resumen" data-route="resumen">
          <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span class="lbl">Resumen</span>
        </a>
        <a href="#/movimientos" data-route="movimientos">
          <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h13M7 7l3-3M7 7l3 3M17 17H4M17 17l-3-3M17 17l-3 3"/></svg>
          <span class="lbl">Movimientos</span>
        </a>
        <a href="#/cuentas" data-route="cuentas">
          <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 15h2"/></svg>
          <span class="lbl">Cuentas</span>
        </a>
        <a href="#/categorias" data-route="categorias">
          <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="4"/><circle cx="16" cy="16" r="4"/><path d="M8 12v4M12 16h4"/></svg>
          <span class="lbl">Categorías</span>
        </a>
        <a href="#/presupuestos" data-route="presupuestos">
          <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span class="lbl">Presupuestos</span>
        </a>
        <a href="#/reportes" data-route="reportes">
          <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
          <span class="lbl">Reportes</span>
        </a>
        <a href="#/perfil" data-route="perfil" class="mobile-only">
          <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
          <span class="lbl">Perfil</span>
        </a>
      </nav>
      <div class="side-foot">
        <a class="user-card" href="#/perfil" data-route="perfil" title="Ver perfil">
          <span class="user-av" id="user-initial" aria-hidden="true">·</span>
          <span class="user-meta">
            <span class="user-name" id="user-name"></span>
            <span class="user-email" id="user-email"></span>
          </span>
        </a>
        <button type="button" id="logout">Cerrar sesión</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="view-title">Resumen</h1>
        <div class="month-nav" id="month-nav">
          <button type="button" id="prev-month" aria-label="Mes anterior">‹</button>
          <span id="month-label" aria-live="polite">—</span>
          <button type="button" id="next-month" aria-label="Mes siguiente">›</button>
        </div>
        <button type="button" id="new-mv" class="btn btn-primary">+ Nuevo movimiento</button>
      </header>
      <div class="content" id="view" tabindex="-1">
        <p class="loading">Cargando tus datos…</p>
      </div>
    </main>
  </div>
</body>
</html>
