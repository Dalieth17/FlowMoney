<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>FlowMoney · Panel</title>
<meta name="description" content="Panel de FlowMoney: registra movimientos, administra categorías y presupuestos, y revisa tus reportes. Funciona sin conexión.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <a class="brand" href="index.html">
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#1F4D3A"/>
        <path d="M6 20c4 0 4-8 10-8s6 8 10 8" stroke="#C08A3E" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M6 24c4 0 4-5 10-5s6 5 10 5" stroke="#8FB49F" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>
      </svg>
      FlowMoney
    </a>
    <nav class="side-nav">
      <a href="#" data-view="resumen" class="active">
        <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span class="lbl">Resumen</span>
      </a>
      <a href="#" data-view="movimientos">
        <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13M7 7l3-3M7 7l3 3M17 17H4M17 17l-3-3M17 17l-3 3"/></svg>
        <span class="lbl">Movimientos</span>
      </a>
      <a href="#" data-view="categorias">
        <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4"/><circle cx="16" cy="16" r="4"/><path d="M8 12v4M12 16h4"/></svg>
        <span class="lbl">Categorías</span>
      </a>
      <a href="#" data-view="presupuestos">
        <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span class="lbl">Presupuestos</span>
      </a>
      <a href="#" data-view="reportes">
        <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
        <span class="lbl">Reportes</span>
      </a>
    </nav>
    <div class="side-foot">
      <div class="user-card">
        <div class="user-av" id="user-av">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
        </div>
        <div class="user-meta">
          <div class="user-name" id="user-name">—</div>
          <div class="user-email" id="user-email"></div>
        </div>
      </div>
      <div class="side-actions">
        <button id="reset-data">↺ Restaurar ejemplo</button>
        <button id="logout">Cerrar sesión</button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <h1 id="view-title">Resumen</h1>
      <div class="month-nav">
        <button id="prev-month" aria-label="Mes anterior">‹</button>
        <span id="month-label">—</span>
        <button id="next-month" aria-label="Mes siguiente">›</button>
      </div>
      <button id="new-mv" class="btn btn-primary">+ Nuevo movimiento</button>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
