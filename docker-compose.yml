# FlowMoney — stack completo: MySQL + API (Node) + Web (Nginx).
#   docker compose up --build   →   http://localhost:8080
#
# Puertos que se usan en tu equipo (cámbialos en .env si alguno está ocupado):
#   8080  web    (WEB_PORT)
#   3307  MySQL  (MYSQL_PORT) — solo accesible desde tu propio equipo (127.0.0.1)
# La API no publica ningún puerto: el navegador le habla a través de Nginx.
# Para producción copia .env.example a .env y cambia las contraseñas.
name: flowmoney

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-flowmoney}
      MYSQL_USER: ${DB_USER:-flowmoney}
      MYSQL_PASSWORD: ${DB_PASSWORD:-flowmoney}
    ports:
      # MySQL en tu equipo: 127.0.0.1:3307 (no el 3306, que suele estar ocupado por un MySQL ya
      # instalado). Sirve para entrar con Workbench/DBeaver. Solo escucha en 127.0.0.1, así que
      # no queda expuesto a la red. Dentro de Docker la API sigue usando db:3306, que es un
      # puerto interno del contenedor y no toca los de tu equipo.
      - '127.0.0.1:${MYSQL_PORT:-3307}:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: '3306' # puerto interno del contenedor (no es MYSQL_PORT)
      DB_NAME: ${DB_NAME:-flowmoney}
      DB_USER: ${DB_USER:-flowmoney}
      DB_PASSWORD: ${DB_PASSWORD:-flowmoney}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
